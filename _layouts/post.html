---
layout: default
---

<header class="header">
  <div class="header-content">
    <div class="header-brand">Yeongsin's AI Lab</div>
    <nav class="header-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/posts/' | relative_url }}">Posts</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </div>
</header>

<article class="container" style="padding: 60px 24px;">
  <div style="max-width: 800px; margin: 0 auto;">
    <header style="margin-bottom: 32px;">
      <span class="post-date" style="display: block; margin-bottom: 8px;">{{ page.date | date: "%B %d, %Y" }}</span>
      {% if page.categories.first %}
      <span class="tag" style="display: inline-block; margin-bottom: 16px;">{{ page.categories.first }}</span>
      {% endif %}
      <h1 style="margin-bottom: 16px;">{{ page.title }}</h1>
    </header>

    <div class="post-content" style="
      font-size: 16px;
      line-height: 1.75;
      color: var(--color-text-primary);
    ">
      {{ content }}
    </div>

    <footer style="
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--color-border-primary);
      text-align: center;
      color: var(--color-text-secondary);
      font-size: 14px;
    ">
      <p>Written by <strong>Yeongsin Byeon</strong></p>
      <p style="margin-top: 8px; font-size: 12px; color: var(--color-text-tertiary);">
        <a href="https://github.com/ByeonYeongsin" style="color: inherit;">GitHub</a> •
        <a href="mailto:yeongsin_byeon@kolon.com" style="color: inherit;">Email</a>
      </p>
    </footer>
  </div>
</article>
