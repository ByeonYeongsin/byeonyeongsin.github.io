theme: jekyll-theme-chirpy

lang: ko-KR
timezone: Asia/Seoul

title: Yeongsin's AI Lab
tagline: AI Engineer · LLM · RAG · ML Systems

description: >-
  LLM, RAG 시스템, 머신러닝에 열정을 가진 AI 엔지니어의 기술 블로그입니다.
  최신 AI 트렌드, 논문 리뷰, 개발 경험을 공유합니다.

url: "https://byeonyeongsin.github.io/yeongsin.github.io"
baseurl: "/yeongsin.github.io"

github:
  username: ByeonYeongsin

social:
  name: Yeongsin Byeon
  email: yeongsin_byeon@kolon.com
  links:
    - https://github.com/ByeonYeongsin

# ===========================
# 사이드바 아바타 이미지
# ===========================
avatar: ""

# ===========================
# TOC 설정
# ===========================
toc: true

# ===========================
# 댓글 (선택)
# ===========================
comments:
  active: ""

# ===========================
# 검색
# ===========================
search:
  provider: local

# ===========================
# SEO
# ===========================
google_site_verification: ""

# ===========================
# Analytics (선택)
# ===========================
analytics:
  google:
    id: ""

# ===========================
# 빌드 설정
# ===========================
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

permalink: /posts/:title/

paginate: 10

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: "_tabs"
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - CHANGELOG.md
  - "*.sh"
  - node_modules
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
